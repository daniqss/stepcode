name: 'Feature Request'
description: Propose a new feature or improvement
title: '[Feature]: '
labels: ['enhancement']

body:
  - type: textarea
    id: why
    attributes:
      label: Why do you need it?
      placeholder: 'I want to be able to... because right now I have to...'
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Which part does it affect?
      options:
        - 'Interpreter — step-by-step execution'
        - 'Generator — static site output'
        - 'Parser — pseudocode syntax'
        - 'CLI'
        - 'UI / Themes'
        - 'Not sure'
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: How should it work?
      placeholder: 'A rough example or sketch is enough.'
    validations:
      required: true
